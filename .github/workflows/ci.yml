name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brokerage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: postgres
      DB_HOST: localhost
      DB_NAME: brokerage
      DB_PASSWORD: postgres
      DB_PORT: 5432
      SECRET_KEY: ci-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Block float helpers under src
        run: |
          if grep -rnE "parseFloat|toFixed" src; then
            echo "parseFloat and toFixed are not allowed under src (see ADR 0001)"
            exit 1
          fi

      - run: npm test
